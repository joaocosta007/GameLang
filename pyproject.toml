[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamelang-compiler"
version = "1.0.0"
description = "Compilador educacional para a DSL GameLang"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Victor Will dos Santos"},
  {name = "Joao Pedro Pirani"},
  {name = "Ryan Markus Maciel Araujo"},
  {name = "Lucas dos Santos Garreto"},
  {name = "Enzo Giuliano Cardoso Santana"},
]

[project.scripts]
gamelang = "gamelang.cli:main"

[tool.setuptools.packages.find]
include = ["gamelang*"]

